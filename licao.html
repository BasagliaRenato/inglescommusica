    <script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(id == 11){
    document.getElementById("titulo").innerText = "Capitulo I";
    document.getElementById("musica").innerText = "Musica I";
}
if(id == 12){
    document.getElementById("titulo").innerText = "Capitulo I";
    document.getElementById("musica").innerText = "Musica II";
}
if(id == 13){
    document.getElementById("titulo").innerText = "Capitulo I";

}

}
if(id == 22){
