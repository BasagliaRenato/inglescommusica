<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lição</title>
    <link rel="stylesheet" href="licao.css">
    <script src="https://kit.fontawesome.com/9bbeeced25.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="header">
    <div class="top">
        <img src="images/bandeira.webp" alt="us" id="flag">
    </div>
    <div class="bottom">
        <div>
        <h1 id="titulo">Capítulo</h1>
        <b><p id="musica">Musica</p></b>
        </div>
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>
<button class="btn-voltar" onclick="history.back()">
    <i class="fa-solid fa-play" style="font-size: 30px; rotate: 180deg;"></i>
</button>
<div>
<div class="lesson-center">
    <div id="image"></div>

    <button class="btn-start">
        Começar Lição <i class="fa-solid fa-play"></i>
    </button>
</div>
</div>
<footer class="footer">
        <div class="icons">

           <a href="icm.html"> <i class="fa-solid fa-house" style="font-size: 30px;"></i> </a>      
            <i class="fa-solid fa-user" style="font-size: 30px;"></i>
            
        </div>
    </footer>

    <script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const lessons = {
    11: {
        titulo: "Like I want you",
        capitulo: "Giveon",
        imagem: "images/likeiwantyou.jpg"
    },
    12: {
        titulo: "Imagine",
        capitulo: "John Lennon",
        imagem: "images/imagine.jpg"
    },
    13: {
        titulo: "Count on me",
        capitulo: "Bruno Mars",
        imagem: "images/countonme.jpg"
    },
    21: {
        titulo: "White Ferrari",
        capitulo: "Frank Ocean",
        imagem: "images/whiteferrari.jpg"
    },
    22: {
        titulo: "Me & U",
        capitulo: "Tems",
        imagem: "images/meandu.jpg"
    },
    23: {
        titulo: "Come and See",
        capitulo: "PARTYNEXTDOOR",
        imagem: "images/comeandsee.jpg"
    }
};

if (lessons[id]) {
    document.getElementById("titulo").innerText = lessons[id].titulo;
    document.getElementById("musica").innerText = lessons[id].capitulo;

    document.getElementById("image").innerHTML = `
        <img src="${lessons[id].imagem}" class="lesson-image">
    `;
}
const menuButton = document.querySelector(".menu");

menuButton.addEventListener("click", () => {
    menuButton.classList.toggle("active");
});
</script>
</body>
</html>
