<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lição</title>
    <link rel="stylesheet" href="licao.css">
    <script src="https://kit.fontawesome.com/9bbeeced25.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="header">
    <div class="top">
        <img src="images/bandeira.webp" alt="us" id="flag">
    </div>
    <div class="bottom">
        <h1 id="titulo">Capítulo I</h1>
        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>
<footer class="footer">
        <div class="icons">
            <i class="fa-solid fa-house" style="font-size: 30px;"></i>
            <i class="fa-solid fa-user" style="font-size: 30px;"></i>
        </div>
    </footer>

    <script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(id == 1){
    document.getElementById("titulo").innerText = "Musica I";
}
if(id == 2){
    document.getElementById("titulo").innerText = "Musica II";
}
if(id == 3){
    document.getElementById("titulo").innerText = "Musica III";
}

</script>
</body>
</html>
